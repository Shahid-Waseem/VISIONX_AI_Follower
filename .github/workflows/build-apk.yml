
name: Build VISION X APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK
        run: gradle -p Vision_X_Cloud/VISIONX_AI_Follower assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VISION-X-AI-Follower-APK
          path: Vision_X_Cloud/VISIONX_AI_Follower/app/build/outputs/apk/debug/*.apk
